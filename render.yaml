services:
  - type: web
    name: dulces-momentos-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dulces-momentos-db
          property: connectionString

databases:
  - name: dulces-momentos-db
    plan: free
